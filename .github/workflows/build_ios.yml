name: Build iOS IPA (LAN Monitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: flutter doctor -v

      - name: Initialize iOS Scaffolding if Needed
        working-directory: ios_app
        run: |
          if [ ! -d "ios" ]; then
            echo "Scaffolding iOS Xcode project..."
            flutter create --platforms=ios --org com.lanmonitor .
          fi

      - name: Configure AppDelegate for Widget AppGroup Synchronization
        working-directory: ios_app
        run: python3 patch_app_delegate.py

      - name: Install Flutter Dependencies
        working-directory: ios_app
        run: flutter pub get

      - name: Inject Custom App Icons
        run: |
          LOGO_SRC="ios_app/assets/icons/AppIcon-Dark.png"
          APPICON_DIR="ios_app/ios/Runner/Assets.xcassets/AppIcon.appiconset"

          if [ -d "$APPICON_DIR" ] && [ -f "$LOGO_SRC" ]; then
            for img in "$APPICON_DIR"/*.png; do
              if [ -f "$img" ]; then
                W=$(sips -g pixelWidth "$img" | awk '/pixelWidth/ {print $2}')
                H=$(sips -g pixelHeight "$img" | awk '/pixelHeight/ {print $2}')
                if [ -n "$W" ] && [ -n "$H" ]; then
                  sips -z "$H" "$W" "$LOGO_SRC" --out "$img" > /dev/null
                  sips -s hasAlpha no "$img" > /dev/null 2>&1 || true
                  echo "Resized custom icon for $img to ${W}x${H} (No Alpha)"
                fi
              fi
            done
            echo "Successfully injected custom app icons using native Apple sips!"
          else
            echo "AppIcon dir not found, skipping icon injection"
          fi

      - name: Configure iOS Permissions & Info.plist
        run: |
          python3 -c "
          import plistlib, os

          plist_path = 'ios_app/ios/Runner/Info.plist'
          if os.path.exists(plist_path):
              with open(plist_path, 'rb') as f:
                  pl = plistlib.load(f)
              
              # Allow HTTP requests in LAN / Tailscale
              pl['NSAppTransportSecurity'] = {'NSAllowsArbitraryLoads': True}
              
              # Local Network permission for iOS 14+
              pl['NSLocalNetworkUsageDescription'] = 'LAN Monitor kết nối đến mạng nội bộ để giám sát thông số phần cứng máy tính.'
              
              # Display Name
              pl['CFBundleDisplayName'] = 'LAN Monitor'
              
              # Allow querying Microsoft Remote Desktop app
              pl['LSApplicationQueriesSchemes'] = ['rdp']
              
              with open(plist_path, 'wb') as f:
                  plistlib.dump(pl, f)
              print('Successfully injected network permissions into Info.plist')
          else:
              print('Info.plist not found, will be created during build')
          "

      - name: Configure Native Xcode Widget Extension Target
        working-directory: ios_app
        run: |
          mkdir -p ios/LANMonitorWidget
          cp -r LANMonitorWidget/* ios/LANMonitorWidget/
          ruby configure_widget_target.rb

      - name: Configure iOS Code Signing Bypass (Disable Signing & Set Dummy Team)
        run: |
          python3 -c "
          import os, re

          # 1. Update project.pbxproj with dummy team ID & disable code sign
          pbx_path = 'ios_app/ios/Runner.xcodeproj/project.pbxproj'
          if os.path.exists(pbx_path):
              with open(pbx_path, 'r', encoding='utf-8') as f:
                  content = f.read()

              # Inject DevelopmentTeam in TargetAttributes
              content = re.sub(
                  r'(TargetAttributes\s*=\s*\{[^\}]*?\{\s*\n)',
                  r'\1\t\t\t\t\t\tDevelopmentTeam = LANMONITOR0;\n',
                  content
              )

              # Inject DEVELOPMENT_TEAM & disable signing in all buildSettings
              content = re.sub(
                  r'(PRODUCT_BUNDLE_IDENTIFIER\s*=\s*[^;]+;)',
                  r'\1\n\t\t\t\tDEVELOPMENT_TEAM = LANMONITOR0;\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;',
                  content
              )

              with open(pbx_path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('Patched project.pbxproj with DEVELOPMENT_TEAM successfully.')

          # 2. Inject into Flutter xcconfig files
          for cfg in ['Release.xcconfig', 'Debug.xcconfig']:
              cfg_path = os.path.join('ios_app/ios/Flutter', cfg)
              if os.path.exists(cfg_path):
                  with open(cfg_path, 'a', encoding='utf-8') as f:
                      f.write('\nDEVELOPMENT_TEAM=LANMONITOR0\nCODE_SIGNING_ALLOWED=NO\nCODE_SIGNING_REQUIRED=NO\nCODE_SIGN_IDENTITY=\n')
                  print(f'Appended signing config to {cfg}')
          "

      - name: Build iOS Release (Unsigned)
        working-directory: ios_app
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build.log

      - name: Upload Build Log if Failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failure
          path: ios_app/build.log

      - name: Build Native iOS WidgetKit Extension via xcodebuild
        working-directory: ios_app
        run: |
          set -o pipefail
          echo "=== Building LANMonitorWidgetExtension with xcodebuild ==="
          xcodebuild \
            -project ios/Runner.xcodeproj \
            -scheme LANMonitorWidgetExtension \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build_widget \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee widget_build.log || {
              echo "=== XCODEBUILD FAILED: Showing error summary ==="
              grep -E "error:|FAILED" widget_build.log | head -n 40
              exit 1
            }

      - name: Embed, Synchronize Info.plist & Ad-hoc Codesign (Exact Gas Manager Architecture)
        run: |
          set -e
          APP_PATH=$(find ios_app/build/ios/iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App bundle not found!"
            exit 1
          fi

          WIDGET_APPEX=$(find ios_app/build_widget -name "LANMonitorWidgetExtension.appex" -type d | head -n 1)
          if [ -z "$WIDGET_APPEX" ]; then
            echo "ERROR: LANMonitorWidgetExtension.appex not found!"
            find ios_app -name "*appex*" || true
            exit 1
          fi

          echo "Found app bundle: $APP_PATH"
          echo "Found Xcode-built widget extension: $WIDGET_APPEX"

          # 1. Create Payload folder directly (Matching Gas Manager packaging)
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          TARGET_APP="Payload/$(basename "$APP_PATH")"
          mkdir -p "$TARGET_APP/PlugIns"

          # 2. Copy extension into Payload/Runner.app/PlugIns/
          cp -r "$WIDGET_APPEX" "$TARGET_APP/PlugIns/"
          TARGET_APPEX="$TARGET_APP/PlugIns/LANMonitorWidgetExtension.appex"

          # 3. Synchronize Info.plist using Python (100% reliable, guarantees CFBundleShortVersionString & CFBundleVersion)
          python3 -c "
          import plistlib, os

          app_plist = '$TARGET_APP/Info.plist'
          ext_plist = '$TARGET_APPEX/Info.plist'

          with open(app_plist, 'rb') as f:
              app_pl = plistlib.load(f)

          with open(ext_plist, 'rb') as f:
              ext_pl = plistlib.load(f)

          version = app_pl.get('CFBundleShortVersionString', '1.1.4')
          build = app_pl.get('CFBundleVersion', '14')
          app_id = app_pl.get('CFBundleIdentifier', 'com.lanmonitor.lanMonitor')
          min_os = app_pl.get('MinimumOSVersion', '15.0')

          ext_pl['CFBundleShortVersionString'] = version
          ext_pl['CFBundleVersion'] = build
          ext_pl['CFBundleIdentifier'] = f'{app_id}.LANMonitorWidgetExtension'
          ext_pl['CFBundleDisplayName'] = 'LAN Monitor'
          ext_pl['CFBundleName'] = 'LANMonitorWidgetExtension'
          ext_pl['CFBundleExecutable'] = 'LANMonitorWidgetExtension'
          ext_pl['MinimumOSVersion'] = min_os
          ext_pl['CFBundlePackageType'] = 'XPC!'
          ext_pl['NSExtension'] = {'NSExtensionPointIdentifier': 'com.apple.widgetkit-extension'}

          with open(ext_plist, 'wb') as f:
              plistlib.dump(ext_pl, f)

          print('=== Synchronized Extension Info.plist Successfully ===')
          for k in ['CFBundleIdentifier', 'CFBundleShortVersionString', 'CFBundleVersion', 'CFBundleDisplayName', 'MinimumOSVersion', 'NSExtension']:
              print(f'  {k}: {ext_pl.get(k)}')
          "

          # Remove PkgInfo from .appex (Gas Manager does not have PkgInfo in .appex)
          rm -f "$TARGET_APPEX/PkgInfo"

          # 4. Ad-hoc codesigning with App Group entitlements directly inside Payload
          echo "Ad-hoc signing Extension with entitlements..."
          codesign -f -s - --entitlements ios_app/LANMonitorWidget/LANMonitorWidget.entitlements "$TARGET_APPEX" || true

          echo "Ad-hoc signing Host App with entitlements..."
          codesign -f -s - --entitlements ios_app/App.entitlements "$TARGET_APP" || true

          echo "=== Code Signature Verification ==="
          codesign -dvvv "$TARGET_APPEX" || true
          codesign -dvvv "$TARGET_APP" || true

          echo "=== Content of Payload/Runner.app/PlugIns ==="
          ls -la "$TARGET_APP/PlugIns"
          ls -la "$TARGET_APPEX"

          # 5. Zip Payload into IPA
          zip -r -9 LANMonitor_iOS.ipa Payload
          ls -lh LANMonitor_iOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LANMonitor_iOS_ipa
          path: LANMonitor_iOS.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create Direct GitHub Release (No Zip)
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.1.4
          name: "LAN Monitor iOS v1.1.4"
          body: "Bản v1.1.4: Khắc phục triệt để lỗi Widget báo online nhưng các thanh tiến trình không chạy (hiển thị 0%). Sửa lỗi đăng ký MethodChannel native, bổ sung cơ chế đồng bộ kép (App Group UserDefaults + widget_data.json trong Shared Container), loại bỏ trạng thái Online giả lập khi chưa có dữ liệu đồng bộ."
          files: LANMonitor_iOS.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
